<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Fire at the Moon Palace</title>


<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #080510;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}


/* =========================
   9:16 GAME SCREEN
   ========================= */

#game {

    position: relative;

    width: min(100vw, 56.25vh);
    height: min(177.78vw, 100vh);

    aspect-ratio: 9 / 16;

    overflow: hidden;

    background: black;

    user-select: none;
}


/* =========================
   CHANG'E IMAGE
   ========================= */

#scene {

    position: absolute;

    width: 100%;
    height: 100%;

    object-fit: cover;

    left: 0;
    top: 0;

    transition:
        opacity 0.25s ease;
}


/* =========================
   TOP DARK GRADIENT
   ========================= */

.bottomShade {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 25%;

    background:
        linear-gradient(
            rgba(0,0,0,.75),
            transparent
        );

    pointer-events: none;
}


/* =========================
   PROGRESS AREA
   ========================= */

#progressPanel {

    position: absolute;

    left: 7%;
    top: 4%;

    width: 86%;

    text-align: center;

    color: white;

    text-shadow:
        0 2px 5px black;
}


#wakeText {

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 8px;
}


/* Progress bar */

.progressOuter {

    width: 100%;

    height: 15px;

    background:
        rgba(255,255,255,.25);

    border-radius: 20px;

    overflow: hidden;

    margin-bottom: 10px;
}


#progressBar {

    width: 0%;

    height: 100%;

    background:
        linear-gradient(
            90deg,
            #ffd15c,
            #ff8a42
        );

    transition:
        width .4s ease;
}


/* Shake circles */

#shakeDots {

    font-size: 22px;

    letter-spacing: 7px;

    margin-bottom: 6px;
}


/* =========================
   START SCREEN
   ========================= */

#startScreen {

    position: absolute;

    inset: 0;

    z-index: 30;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 30px;

    color: white;

    background:
        rgba(5,2,10,.88);
}


.startFire {

    font-size: 55px;

    margin-bottom: 12px;

    animation:
        firePulse 1s infinite alternate;
}


@keyframes firePulse {

    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.15);
    }
}


#startScreen h1 {

    margin: 0 0 14px;

    color: #ffd36a;

    font-size: 27px;
}


#startScreen p {

    margin:
        0 0 25px;

    line-height: 1.45;

    font-size: 16px;
}


#startButton {

    border: none;

    border-radius: 30px;

    padding:
        15px 32px;

    font-size: 19px;

    font-weight: bold;

    color: #411300;

    background:
        linear-gradient(
            #ffe27c,
            #ff9d3d
        );

    cursor: pointer;

    box-shadow:
        0 0 20px
        rgba(255,150,40,.7);
}


/* =========================
   DESKTOP TEST BUTTON
   ========================= */

#testShake {

    position: absolute;

    right: 10px;
    top: 10px;

    z-index: 15;

    border: 1px solid
        rgba(255,255,255,.5);

    border-radius: 12px;

    padding: 8px 12px;

    color: white;

    background:
        rgba(0,0,0,.55);

    font-size: 12px;

    display: none;
}


/* =========================
   SUCCESS MESSAGE
   ========================= */

#success {

    position: absolute;

    inset: 0;

    z-index: 25;

    display: none;

    align-items: flex-start;

    justify-content: center;

    padding-top: 5%;

    pointer-events: none;
}


.successBox {

    color: white;

    text-align: center;

    font-weight: bold;

    font-size: 18px;

    padding:
        12px 20px;

    border-radius: 20px;

    background:
        rgba(20,40,70,.70);

    text-shadow:
        0 2px 5px black;
}


/* =========================
   HIDDEN FALLBACK TRIGGER

   Invisible top-right area.
   Tap once to reveal the
   manual Wake Chang'e button.
   ========================= */

#fallbackTrigger {

    position: absolute;

    top: 0;
    right: 0;

    width: 25%;
    height: 15%;

    z-index: 20;

    background: transparent;

    -webkit-tap-highlight-color:
        transparent;
}


/* =========================
   FALLBACK BUTTON
   ========================= */

#fallbackButton {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 21;

    display: none;

    border: none;

    border-radius: 32px;

    padding:
        17px 30px;

    font-size: 20px;

    font-weight: bold;

    white-space: nowrap;

    color: #411300;

    background:
        linear-gradient(
            #ffe27c,
            #ff9d3d
        );

    box-shadow:
        0 0 22px
        rgba(255,150,40,.8);

    cursor: pointer;

    -webkit-tap-highlight-color:
        transparent;
}


#fallbackButton:active {

    transform:
        translate(-50%, -50%)
        scale(0.95);
}


</style>

</head>


<body>


<div id="game">


    <!-- Current Chang'e image -->

    <img
        id="scene"
        src="Change-00.png"
        alt="Chang'e sleeping while the Moon Palace burns"
    >


    <!-- Top dark gradient -->

    <div class="bottomShade"></div>


    <!-- Progress -->

    <div id="progressPanel">

        <div id="wakeText">
            Wake Chang'e! — 0%
        </div>


        <div class="progressOuter">

            <div id="progressBar"></div>

        </div>


        <div id="shakeDots">
            ○ ○ ○
        </div>

    </div>


    <!--
        Invisible emergency fallback.

        Tap the top-right corner
        to reveal the manual button.
    -->

    <div
        id="fallbackTrigger"
        aria-hidden="true">
    </div>


    <!-- Manual fallback button -->

    <button
        id="fallbackButton"
        type="button">

        🐇 Wake Chang'e

    </button>


    <!-- Desktop testing -->

    <button
        id="testShake"
        type="button">

        TEST SHAKE

    </button>


    <!-- Success -->

    <div id="success">

        <div class="successBox">

            💦 Moon Spring activated!

        </div>

    </div>


    <!-- Start screen -->

    <div id="startScreen">

        <div class="startFire">
            🔥
        </div>


        <h1>
            月宮失火！<br>
            Fire at the Moon Palace!
        </h1>


        <p>
            神秘火焰正在吞噬月宮的寶物！<br>
            嫦娥卻還在沉睡……<br><br>

            Magical flames are closing in on<br>
            the Moon Palace treasure!<br>
            But Chang'e is still fast asleep...
        </p>


        <button
            id="startButton"
            type="button">

            🔥 開始任務 / START

        </button>

    </div>


    <!-- AUDIO -->

    <audio
        id="fireSound"
        src="FireSound.mp3"
        preload="auto"
        loop>
    </audio>


    <audio
        id="sleepSound"
        src="SleepSound.mp3"
        preload="auto"
        loop>
    </audio>


    <audio
        id="waterSound"
        src="WaterSound.mp3"
        preload="auto">
    </audio>


</div>



<script>


/* =========================
   ELEMENTS
   ========================= */


const scene =
document.getElementById("scene");


const progressPanel =
document.getElementById("progressPanel");


const bottomShade =
document.querySelector(".bottomShade");


const progressBar =
document.getElementById("progressBar");


const wakeText =
document.getElementById("wakeText");


const shakeDots =
document.getElementById("shakeDots");


const startScreen =
document.getElementById("startScreen");


const startButton =
document.getElementById("startButton");


const testShake =
document.getElementById("testShake");


const success =
document.getElementById("success");


const fallbackTrigger =
document.getElementById("fallbackTrigger");


const fallbackButton =
document.getElementById("fallbackButton");


const fireSound =
document.getElementById("fireSound");


const sleepSound =
document.getElementById("sleepSound");


const waterSound =
document.getElementById("waterSound");



/* =========================
   GAME SETTINGS
   ========================= */


const stages = [

    {
        percent: 0,
        image: "Change-00.png",

        /* Snoring is dominant */
        sleepVolume: 1.00,
        fireVolume: 0.08
    },

    {
        percent: 20,
        image: "Change-20.png",

        /* Snoring still dominant */
        sleepVolume: 1.00,
        fireVolume: 0.12
    },

    {
        percent: 40,
        image: "Change-40.png",

        /* Chang'e beginning to wake */
        sleepVolume: 0.85,
        fireVolume: 0.20
    },

    {
        percent: 60,
        image: "Change-60.png",

        /* Snoring stops */
        sleepVolume: 0,
        fireVolume: 0.35
    },

    {
        percent: 80,
        image: "Change-80.png",

        sleepVolume: 0,
        fireVolume: 0.55
    },

    {
        percent: 100,
        image: "Change-100.png",

        sleepVolume: 0,
        fireVolume: 0
    }

];


let stageIndex = 0;


let shakesThisStage = 0;


const shakesNeeded = 3;


let gameStarted = false;


let gameFinished = false;


let fallbackMode = false;


let lastShakeTime = 0;


/*
   Higher number =
   harder shake required.
*/

const shakeThreshold = 18;


const shakeCooldown = 400;



/* =========================
   START GAME
   ========================= */


async function startGame() {


    /*
       iPhone / iPad may require
       motion permission.
    */


    if (

        typeof DeviceMotionEvent !== "undefined"

        &&

        typeof DeviceMotionEvent.requestPermission
        === "function"

    ) {


        try {


            const permission =
            await DeviceMotionEvent
            .requestPermission();


            /*
               IMPORTANT:

               Even if motion permission
               is denied, we still allow
               the game to start.

               The hidden fallback can
               then be used.
            */


            if (permission !== "granted") {


                console.log(
                    "Motion permission not granted. Fallback remains available."
                );

            }


        }

        catch (error) {


            console.log(
                "Motion permission error:",
                error
            );


            /*
               Do NOT stop the game.
               Manual fallback remains
               available.
            */

        }

    }



    gameStarted = true;


    startScreen.style.display =
        "none";



    /* =========================
       START FIRE + SNORING

       Fire is deliberately quiet.
       Snoring is the main sound.
       ========================= */


    fireSound.volume =
        0.08;


    sleepSound.volume =
        1.00;


    fireSound.play()
    .catch((error) => {

        console.log(
            "Fire sound error:",
            error
        );

    });


    sleepSound.play()
    .catch((error) => {

        console.log(
            "Sleep sound error:",
            error
        );

    });



    /* =========================
       UNLOCK WATER AUDIO
       FOR IPHONE

       WaterSound is silently
       started during the original
       START interaction.

       This prepares it for later
       playback at 100%.
       ========================= */


    waterSound.volume =
        0;


    const unlockWater =
        waterSound.play();


    if (unlockWater !== undefined) {


        unlockWater
        .then(() => {


            waterSound.pause();


            waterSound.currentTime =
                0;


            waterSound.volume =
                1.0;


            console.log(
                "Water sound unlocked."
            );


        })
        .catch((error) => {


            console.log(
                "Water sound unlock error:",
                error
            );


            waterSound.volume =
                1.0;

        });

    }



    updateStage();



    /*
       Start listening for
       real physical shaking.
    */


    window.addEventListener(
        "devicemotion",
        detectShake
    );



    /*
       Show TEST SHAKE on
       desktop computers.
    */


    if (

        !("ontouchstart" in window)

    ) {


        testShake.style.display =
            "block";

    }

}



/* =========================
   DETECT REAL SHAKE
   ========================= */


function detectShake(event) {


    if (

        !gameStarted ||
        gameFinished

    ) {


        return;

    }



    const acceleration =
        event.accelerationIncludingGravity;


    if (!acceleration) {


        return;

    }



    const x =
        acceleration.x || 0;


    const y =
        acceleration.y || 0;


    const z =
        acceleration.z || 0;



    const strength =
        Math.sqrt(

            x * x +
            y * y +
            z * z

        );



    const now =
        Date.now();



    if (

        strength > shakeThreshold

        &&

        now - lastShakeTime >
        shakeCooldown

    ) {


        lastShakeTime =
            now;


        registerShake();

    }

}



/* =========================
   REGISTER ONE SHAKE / TAP

   Real shake,
   fallback button,
   and desktop test button

   ALL use this same function.
   ========================= */


function registerShake() {


    if (

        !gameStarted ||
        gameFinished

    ) {


        return;

    }



    shakesThisStage++;



    /*
       Small vibration where
       supported.
    */


    if (navigator.vibrate) {


        navigator.vibrate(35);

    }



    updateShakeDots();



    /*
       Three shakes/taps =
       next stage.
    */


    if (

        shakesThisStage >=
        shakesNeeded

    ) {


        shakesThisStage =
            0;


        stageIndex++;



        if (

            stageIndex >=
            stages.length - 1

        ) {


            stageIndex =
                stages.length - 1;


            finishGame();


        }

        else {


            updateStage();



            if (navigator.vibrate) {


                navigator.vibrate(
                    [60,40,60]
                );

            }

        }

    }

}



/* =========================
   UPDATE IMAGE + AUDIO
   ========================= */


function updateStage() {


    const stage =
        stages[stageIndex];



    /*
       Fade current image.
    */


    scene.style.opacity =
        "0.3";


    setTimeout(

        function() {


            scene.src =
                stage.image;


            scene.style.opacity =
                "1";


        },

        150

    );



    /*
       Progress percentage.
    */


    progressBar.style.width =
        stage.percent + "%";


    wakeText.textContent =
        "Wake Chang'e! — "
        + stage.percent
        + "%";



    /*
       Fire gets progressively
       stronger.
    */


    fireSound.volume =
        stage.fireVolume;



    /*
       Snoring continues until
       Chang'e reaches 60%.
    */


    if (

        stage.sleepVolume > 0

    ) {


        sleepSound.volume =
            stage.sleepVolume;


        if (sleepSound.paused) {


            sleepSound.play()
            .catch(() => {});

        }


    }

    else {


        sleepSound.pause();

    }



    updateShakeDots();

}



/* =========================
   SHAKE / TAP DOTS
   ========================= */


function updateShakeDots() {


    let dots =
        "";


    for (

        let i = 0;

        i < shakesNeeded;

        i++

    ) {


        if (

            i < shakesThisStage

        ) {


            dots +=
                "● ";


        }

        else {


            dots +=
                "○ ";

        }

    }


    shakeDots.textContent =
        dots.trim();

}



/* =========================
   HIDDEN FALLBACK TRIGGER
   ========================= */


fallbackTrigger.addEventListener(

    "click",

    function() {


        if (

            !gameStarted ||
            gameFinished ||
            fallbackMode

        ) {


            return;

        }



        /*
           Activate fallback mode.
        */


        fallbackMode =
            true;



        /*
           Reveal large manual
           button in centre.
        */


        fallbackButton.style.display =
            "block";



        /*
           Remove invisible trigger
           so it cannot accidentally
           activate again.
        */


        fallbackTrigger.style.display =
            "none";

    }

);



/* =========================
   FALLBACK WAKE BUTTON

   Each tap = one shake.
   ========================= */


fallbackButton.addEventListener(

    "click",

    function() {


        if (

            gameStarted &&
            !gameFinished

        ) {


            registerShake();

        }

    }

);



/* =========================
   100% SUCCESS
   ========================= */


function finishGame() {


    gameFinished =
        true;



    /*
       Hide progress UI.

       This keeps the final
       secret code visible.
    */


    progressPanel.style.display =
        "none";


    bottomShade.style.display =
        "none";


    testShake.style.display =
        "none";


    fallbackButton.style.display =
        "none";


    fallbackTrigger.style.display =
        "none";



    /*
       Stop fire and snoring.
    */


    fireSound.pause();


    sleepSound.pause();



    /*
       Change to final image.
    */


    scene.style.opacity =
        "0.3";


    setTimeout(

        function() {


            scene.src =
                "Change-100.png";


            scene.style.opacity =
                "1";



            /* =========================
               PLAY WATER SOUND
               ========================= */


            waterSound.pause();


            waterSound.currentTime =
                0;


            waterSound.volume =
                1.0;



            const waterPlay =
                waterSound.play();



            if (

                waterPlay !== undefined

            ) {


                waterPlay
                .catch((error) => {


                    console.log(
                        "Water playback failed:",
                        error
                    );


                });

            }



            /*
               Show success banner
               at TOP of screen.
            */


            success.style.display =
                "flex";


        },

        300

    );



    /*
       Stop listening for
       physical shaking.
    */


    window.removeEventListener(
        "devicemotion",
        detectShake
    );

}



/* =========================
   START BUTTON
   ========================= */


startButton.addEventListener(

    "click",

    startGame

);



/* =========================
   DESKTOP TEST BUTTON

   Each click = one shake.
   ========================= */


testShake.addEventListener(

    "click",

    function() {


        if (

            gameStarted &&
            !gameFinished

        ) {


            registerShake();

        }

    }

);


</script>


</body>

</html>
